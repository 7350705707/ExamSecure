version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: exam-app:latest
    container_name: exam-app
    restart: unless-stopped
    env_file:
      - ./exam-server-backend/.env
    ports:
      - "8001:8001"
    volumes:
      - ./data/exam.db:/app/exam.db
      - ./data/uploads:/app/uploads
      - ./data/logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes: {}
